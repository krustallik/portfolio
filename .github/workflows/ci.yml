name: Portfolio CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start Dockerized development server
        run: docker compose up -d --build portfolio
      - name: Lint, types, tests, and static build
        run: |
          docker compose exec -T portfolio npm run lint
          docker compose exec -T portfolio npm run typecheck
          docker compose exec -T portfolio npm run test:run
          docker compose exec -T portfolio npm run build
      - name: Browser smoke and responsive checks
        run: docker compose --profile test run --build --rm e2e
      - name: Build the production image
        run: docker compose -f compose.production.yaml build --pull
      - name: Start and health-check production Nginx
        run: |
          docker compose -f compose.production.yaml up -d
          for attempt in $(seq 1 15); do
            if curl --fail --silent http://127.0.0.1:4173/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.production.yaml logs
          exit 1
      - name: Stop project containers
        if: always()
        run: |
          docker compose -f compose.production.yaml down
          docker compose down
