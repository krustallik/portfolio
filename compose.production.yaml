services:
  portfolio:
    build:
      context: .
      target: runtime
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-}
    image: ihor-havryliv-portfolio:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-4173}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
