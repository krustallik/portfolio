services:
  portfolio-web:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    container_name: portfolio-web
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    volumes:
      - /srv/portfolio:/usr/share/nginx/html:ro
      - /etc/portfolio/nginx/vps.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/portfolio/nginx/security-headers.inc:/etc/nginx/security-headers.inc:ro
    networks:
      gymbeam-internal:
        aliases:
          - portfolio-web
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  gymbeam-internal:
    name: gymbeam-internal
    external: true
