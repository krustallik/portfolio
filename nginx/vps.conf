server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html/current;
    index index.html;

    server_tokens off;
    absolute_redirect off;
    include /etc/nginx/security-headers.inc;

    location = /health {
        access_log off;
        include /etc/nginx/security-headers.inc;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location ~ /\. {
        deny all;
    }

    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        try_files $uri =404;
    }

    location ^~ /assets/ {
        expires 1y;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location ^~ /images/projects/ {
        expires 30d;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    location = /social-preview.png {
        expires 1d;
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri/index.html $uri /index.html;
    }
}
